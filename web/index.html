<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DesignWear: design, wear and remix custom T-shirts</title>
  <meta name="description" content="Design your own T-shirt, remix designs from the community, and have it made and delivered by a local team. Try it on virtually before you order.">
  <meta name="keywords" content="custom T-shirts, design your own T-shirt, T-shirt printing, remix designs, virtual try-on, DesignWear">
  <meta name="author" content="DesignWear">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#14141A">
  <meta name="color-scheme" content="dark light">
  <link rel="canonical" href="__SITE_URL__/">

  <!-- Link previews (WhatsApp, Facebook, LinkedIn, Slack, ...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DesignWear">
  <meta property="og:locale" content="en_IN">
  <meta property="og:title" content="DesignWear: design, wear and remix custom T-shirts">
  <meta property="og:description" content="Design your own T-shirt, remix the community's designs, and get it made and delivered locally.">
  <meta property="og:url" content="__SITE_URL__/">
  <meta property="og:image" content="__SITE_URL__/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="DesignWear: Design it. Wear it. Remix it.">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DesignWear: design, wear and remix custom T-shirts">
  <meta name="twitter:description" content="Design your own T-shirt, remix the community's designs, and get it made and delivered locally.">
  <meta name="twitter:image" content="__SITE_URL__/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DesignWear">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <!-- Helps search engines show the site name and logo -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "name": "DesignWear",
        "url": "__SITE_URL__/",
        "description": "Design, wear and remix custom T-shirts."
      },
      {
        "@type": "Organization",
        "name": "DesignWear",
        "url": "__SITE_URL__/",
        "logo": "__SITE_URL__/icons/Icon-512.png"
      }
    ]
  }
  </script>
</head>
<body>
  <!-- Shown to search engines and to anyone with scripts off; the app replaces it. -->
  <noscript>
    <h1>DesignWear</h1>
    <p>Design your own T-shirt, remix designs from the community, and have it made and delivered by a local team.</p>
    <p>DesignWear needs JavaScript to run. Please turn it on and reload the page.</p>
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
