org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Workaround: Kotlin incremental compiler fails on Windows when project (D:) and
# pub cache (C:) are on different drives — it can't compute cross-drive relative paths.
kotlin.incremental=false

# Workaround: Gradle 8.14 on Windows sometimes fails to atomically rename transform
# cache directories when a previous daemon still holds file handles.
# Disabling the daemon forces a fresh JVM per build, eliminating the stale lock.
org.gradle.daemon=false
