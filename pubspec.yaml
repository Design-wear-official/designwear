name: designwear
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_sanity:
    path: packages/flutter_sanity
  cached_network_image: ^3.4.1
  google_fonts: ^8.0.0
  provider: ^6.1.1
  gokwik: ^1.0.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^6.0.0
  firebase_core: ^4.4.0
  google_sign_in: ^6.2.1

  # Virtual Try-On Dependencies
  image_picker: ^1.0.7
  http: ^1.3.0
  path_provider: ^2.1.2
  share_plus: ^12.0.1
  permission_handler: ^12.0.1
  carousel_slider: ^5.1.2
  firebase_crashlytics: ^5.0.7
  sqflite: ^2.4.2
  path: ^1.9.1
  firebase_ai: ^3.8.0
  firebase_messaging: ^16.1.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/system_prompt.txt
    - .env