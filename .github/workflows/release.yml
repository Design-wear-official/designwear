name: Release

# Cut a release after bumping `version:` in pubspec.yaml (e.g. 1.4.0+22) and
# merging to main, in either of two ways:
#   1. Actions tab -> Release -> Run workflow, entering the version (1.4.0:
#      no leading "v", no build number). The workflow creates and pushes the tag.
#   2. Push a tag yourself:  git tag -s -m v1.4.0 v1.4.0 && git push origin v1.4.0
#
# Builds a signed Android APK (external flavour) and a web bundle, writes
# checksums, optionally GPG-signs them, and attaches everything to a GitHub Release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match pubspec.yaml), e.g. 1.4.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Full history + tags so the release notes can diff against the previous tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Determine release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=v${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Verify tag matches pubspec.yaml version
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PUBSPEC_VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::$TAG_NAME does not match pubspec.yaml version ($PUBSPEC_VERSION)."
            exit 1
          fi

      # Manual trigger only: a tag push already created its own tag.
      - name: Create and push the release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "$TAG_NAME"
          git push origin "$TAG_NAME"

      # The app bundles .env as an asset, so only public values go in it. The CMS
      # credentials live on the API server, never in a build of the app.
      - name: Write .env from repository secrets
        run: |
          cat > .env <<EOF
          DESIGNWEAR_API_URL=${{ secrets.DESIGNWEAR_API_URL }}
          EOF
          printf '# CI placeholder\n' > .env.local

      # Android release signing. Store the keystore base64-encoded:
      #   base64 -w0 upload-keystore.jks
      # Without these secrets the build falls back to the debug key (fine for
      # testing, not for the Play Store).
      - name: Set up Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; signing the APK with the debug key."
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release --flavor external --dart-define=FLAVOR=external

      - name: Build web
        run: |
          flutter build web --release --dart-define=FLAVOR=external
          (cd build/web && zip -qr "$GITHUB_WORKSPACE/designwear-web.zip" .)

      - name: Rename artifacts with version
        run: |
          VERSION="${TAG_NAME#v}"
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-external-release.apk "release-artifacts/designwear-${VERSION}.apk"
          cp designwear-web.zip "release-artifacts/designwear-web-${VERSION}.zip"

      - name: Generate checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS

      # Optional: GPG-sign the artifacts so downloads can be verified. Skipped
      # (not failed) when no key is configured.
      - name: Sign artifacts and checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: release-artifacts
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY not set; publishing unsigned checksums."
            exit 0
          fi
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"
          for f in designwear-*.apk designwear-web-*.zip SHA256SUMS; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file "$RUNNER_TEMP/gpg-passphrase" \
              --detach-sign --armor "$f"
          done
          shred -u "$RUNNER_TEMP/gpg-passphrase"

      # Notes come from commit messages between the previous tag and this one.
      - name: Build release notes from commit history
        run: |
          PREV_TAG="$(git tag --sort=v:refname | grep -B1 -x "$TAG_NAME" | head -1)"
          if [ "$PREV_TAG" = "$TAG_NAME" ]; then
            git log --reverse --pretty=format:'- %s' "$TAG_NAME" > "$RUNNER_TEMP/release-notes.md"
          else
            git log --reverse --pretty=format:'- %s' "$PREV_TAG".."$TAG_NAME" > "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            release-artifacts/*
