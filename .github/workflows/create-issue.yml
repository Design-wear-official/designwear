name: Create Prioritized Issue

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      issue_title:
        description: 'Title of the issue to create'
        required: true
        default: 'Automated P1 Issue'
      issue_body:
        description: 'Body of the issue to create'
        required: true
        default: 'This issue was automatically generated by a workflow.'
      issue_priority:
        description: 'Priority label (e.g., p0, p1, p2, p3, p4)'
        required: true
        default: 'p1'

jobs:
  create_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write # Grant write permission for issues

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create issue with priority labels
      # The gh issue create command creates a new issue
      run: |
        gh issue create --title "${{ github.event.inputs.issue_title }}" --body "${{ github.event.inputs.issue_body }}" --label "${{ github.event.inputs.issue_priority }}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
