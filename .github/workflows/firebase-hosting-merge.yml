name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Built-in caching pulls in actions/cache@v5 (a tag, not a SHA), which
          # the org's SHA-pinning policy rejects.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: |
          flutter build web --release --no-wasm-dry-run -t lib/main.dart \
            --dart-define=SANITY_PROJECT_ID=jh7llku7 \
            --dart-define=SANITY_DATASET=production \
            --dart-define=USE_WEB_API=true \
            --dart-define=WEB_API_BASE_URL=https://designwear-backend.vishwamai.com/api

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DESIGNWEAR_731C9 }}
          channelId: live
          projectId: designwear-731c9
