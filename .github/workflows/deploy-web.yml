name: Deploy web (Vercel)

# Builds the Flutter web app and deploys it to Vercel with an access token.
# Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID and
# DESIGNWEAR_API_URL (the public address of the API). See the documentation repo (07-deployment).

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel credentials
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (see the documentation repo, 07-deployment)."
              exit 1
            fi
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Installed by hand: subosito/flutter-action pulls in actions/cache@v5,
      # which this repo's SHA-pinning policy rejects.
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # The app bundles .env as an asset and the site serves it publicly, so only
      # public values go in it. The CMS credentials live on the API server. The
      # Firebase web config (not secret: it identifies the project) switches on
      # "Continue with Google"; leave those secrets out and the button stays hidden.
      - name: Write public .env
        env:
          API_URL: ${{ secrets.DESIGNWEAR_API_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
        run: |
          printf 'DESIGNWEAR_API_URL=%s\n' "$API_URL" > .env
          for name in FIREBASE_PROJECT_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_AUTH_DOMAIN \
                      FIREBASE_STORAGE_BUCKET FIREBASE_WEB_API_KEY FIREBASE_WEB_APP_ID; do
            if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}" >> .env; fi
          done
          printf '# CI placeholder\n' > .env.local

      - run: flutter pub get
      - run: flutter build web --release --dart-define=FLAVOR=external

      # robots.txt, sitemap.xml and the page's link-preview tags need the site's own
      # address. Set the repository variable SITE_URL when you move to a custom domain.
      - name: Fill in the site address
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://designwear-tawny.vercel.app' }}
        run: |
          site="${SITE_URL%/}"
          sed -i "s#__SITE_URL__#${site}#g" build/web/index.html build/web/robots.txt build/web/sitemap.xml
          if grep -rl "__SITE_URL__" build/web >/dev/null; then echo "::error::SITE_URL placeholder left behind"; exit 1; fi

      # A small file naming the commit this build came from, so the live site can
      # be checked against what was deployed (see the check step below).
      - name: Stamp the build
        run: |
          printf '%s %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > build/web/build-info.txt

      # Deployed from a copy outside the git checkout. Otherwise the CLI attaches the
      # commit author, and Vercel blocks the deploy when that GitHub account is not a
      # member of the Vercel team. The token is read from VERCEL_TOKEN.
      - name: Deploy build/web to Vercel (production)
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp -r build/web/. "$site"
          cd "$site"
          npx --yes vercel@65.5.0 deploy --prod --yes

      # Says plainly whether the public address serves this build. If it does not,
      # the domain is attached to a different Vercel project than VERCEL_PROJECT_ID
      # (or the deployment is behind Vercel's login protection).
      - name: Check the live site serves this build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://designwear-tawny.vercel.app' }}
        run: |
          url="${SITE_URL%/}/build-info.txt"
          for i in 1 2 3 4 5 6; do
            live="$(curl -fsS --max-time 20 "$url" 2>/dev/null | cut -d' ' -f1 || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "OK: $url serves $GITHUB_SHA"; exit 0
            fi
            sleep 10
          done
          echo "::warning::$url does not serve this build (it answered: '${live:-nothing}', expected $GITHUB_SHA). The public address is not pointing at the project this workflow deploys to."
