name: Deploy web (Vercel)

# Builds the Flutter web app and deploys it to Vercel with an access token.
# Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID and
# DESIGNWEAR_API_URL (the public address of the API). See docs/deployment.md.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel credentials
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (see docs/deployment.md)."
              exit 1
            fi
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Installed by hand: subosito/flutter-action pulls in actions/cache@v5,
      # which this repo's SHA-pinning policy rejects.
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # The app bundles .env as an asset and the site serves it publicly, so only
      # public values go in it. The CMS credentials live on the API server. The
      # Firebase web config (not secret: it identifies the project) switches on
      # "Continue with Google"; leave those secrets out and the button stays hidden.
      - name: Write public .env
        env:
          API_URL: ${{ secrets.DESIGNWEAR_API_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
        run: |
          printf 'DESIGNWEAR_API_URL=%s\n' "$API_URL" > .env
          for name in FIREBASE_PROJECT_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_AUTH_DOMAIN \
                      FIREBASE_STORAGE_BUCKET FIREBASE_WEB_API_KEY FIREBASE_WEB_APP_ID; do
            if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}" >> .env; fi
          done
          printf '# CI placeholder\n' > .env.local

      - run: flutter pub get
      - run: flutter build web --release --dart-define=FLAVOR=external

      # Deployed from a copy outside the git checkout. Otherwise the CLI attaches the
      # commit author, and Vercel blocks the deploy when that GitHub account is not a
      # member of the Vercel team. The token is read from VERCEL_TOKEN.
      - name: Deploy build/web to Vercel (production)
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp -r build/web/. "$site"
          cd "$site"
          npx --yes vercel@65.5.0 deploy --prod --yes
